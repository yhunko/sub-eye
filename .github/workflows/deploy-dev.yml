name: Deploy Dev

on:
  push:
    branches:
      - dev

concurrency:
  group: deploy-dev
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-preview:
    name: Semantic Release & Deploy
    runs-on: ubuntu-latest
    environment: "development"
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@v3

      - name: Check Agent Guidelines Mirrors
        run: bun run guidelines:check

      - name: Install Dependencies
        run: bun install

      - name: Run Semantic Release
        id: semantic_release
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          HUSKY: 0

      - name: Sync Release PR (dev -> main)
        if: steps.semantic_release.outputs.new_release_published == 'true'
        uses: actions/github-script@v7
        env:
          RELEASE_VERSION: ${{ steps.semantic_release.outputs.new_release_version }}
          RELEASE_NOTES: ${{ steps.semantic_release.outputs.new_release_notes }}
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sourceBranch = "dev";
            const targetBranch = "main";
            const compareRef = `${targetBranch}...${sourceBranch}`;
            const releaseVersion = process.env.RELEASE_VERSION ?? "";
            const releaseNotes = (process.env.RELEASE_NOTES ?? "").trim();
            const stableVersion = releaseVersion.split("-")[0];
            const prTitle = `release/v${stableVersion}`;

            if (!releaseVersion || !/^\d+\.\d+\.\d+/.test(stableVersion)) {
              core.setFailed(`Invalid release version received from semantic-release: ${releaseVersion}`);
              return;
            }

            const compareResponse = await github.rest.repos.compareCommitsWithBasehead({
              owner,
              repo,
              basehead: compareRef,
            });

            const rawCommits = compareResponse.data.commits ?? [];
            const MAX_COMMITS_IN_BODY = 120;

            const commits = rawCommits
              .map((commit) => {
                const subject = (commit.commit.message ?? "").split("\n")[0].trim();
                return {
                  sha: commit.sha,
                  subject,
                };
              })
              .filter((commit) => commit.subject.length > 0)
              .filter((commit) => !/^Merge\b/i.test(commit.subject))
              .filter((commit) => !/^chore\(release\):/i.test(commit.subject))
              .filter((commit) => !/^chore:\s*sync release from main to dev/i.test(commit.subject));

            const totalCommitCount = commits.length;
            const summarizedCommits =
              commits.length > MAX_COMMITS_IN_BODY
                ? commits.slice(commits.length - MAX_COMMITS_IN_BODY)
                : commits;

            const labelsByType = {
              feat: "Features (✨)",
              fix: "Fixes (🐛)",
              perf: "Performance (⚡)",
              refactor: "Refactors (♻️)",
              docs: "Documentation (📝)",
              test: "Tests (✅)",
              chore: "Chores (🧰)",
              other: "Other Changes (📦)",
            };

            const sectionOrder = [
              "feat",
              "fix",
              "perf",
              "refactor",
              "docs",
              "test",
              "chore",
              "other",
            ];

            const grouped = {
              feat: [],
              fix: [],
              perf: [],
              refactor: [],
              docs: [],
              test: [],
              chore: [],
              other: [],
            };

            for (const commit of summarizedCommits) {
              const match = /^([a-z]+)(\([^)]+\))?(!)?:\s+(.+)$/i.exec(commit.subject);

              if (!match) {
                grouped.other.push({
                  sha: commit.sha,
                  summary: commit.subject,
                });
                continue;
              }

              const [, rawType, , breakingFlag, rawSummary] = match;
              const type = sectionOrder.includes(rawType.toLowerCase()) ? rawType.toLowerCase() : "other";
              const summary = breakingFlag ? `${rawSummary} (breaking)` : rawSummary;

              grouped[type].push({
                sha: commit.sha,
                summary,
              });
            }

            const compareUrl = `https://github.com/${owner}/${repo}/compare/${compareRef}`;
            const bodyLines = [
              "## Release Summary",
              "",
              `- Target production version: \`v${stableVersion}\``,
              `- Source prerelease version: \`v${releaseVersion}\``,
              `- Branch flow: \`${sourceBranch}\` -> \`${targetBranch}\``,
              `- Compare changes: [${compareRef}](${compareUrl})`,
              `- Included commits in summary: \`${summarizedCommits.length}\` of \`${totalCommitCount}\``,
              "",
            ];

            if (releaseNotes.length > 0) {
              bodyLines.push("## Latest Beta Release Notes");
              bodyLines.push("");
              bodyLines.push(releaseNotes);
              bodyLines.push("");
            }

            bodyLines.push("## Changelist");
            bodyLines.push("");

            if (totalCommitCount > summarizedCommits.length) {
              bodyLines.push(
                `> Showing latest ${summarizedCommits.length} commits for readability. Use compare link for full delta.`,
              );
              bodyLines.push("");
            }

            let hasEntries = false;
            for (const type of sectionOrder) {
              const entries = grouped[type];
              if (entries.length === 0) {
                continue;
              }

              hasEntries = true;
              bodyLines.push(`### ${labelsByType[type]}`);
              bodyLines.push("");

              for (const entry of entries) {
                const shortSha = entry.sha.slice(0, 7);
                const commitUrl = `https://github.com/${owner}/${repo}/commit/${entry.sha}`;
                bodyLines.push(`- ${entry.summary} ([${shortSha}](${commitUrl}))`);
              }

              bodyLines.push("");
            }

            if (!hasEntries) {
              bodyLines.push("No conventional commit changes found in pending delta.");
              bodyLines.push("");
            }

            bodyLines.push("_This PR body is auto-generated from semantic-release + main...dev comparison._");
            const body = bodyLines.join("\n");

            const existingPrs = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              base: targetBranch,
              head: `${owner}:${sourceBranch}`,
              per_page: 1,
            });

            if (existingPrs.data.length > 0) {
              const existingPr = existingPrs.data[0];
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: existingPr.number,
                title: prTitle,
                body,
                base: targetBranch,
              });
              core.info(`Updated release PR #${existingPr.number} (${prTitle}).`);
            } else {
              const createdPr = await github.rest.pulls.create({
                owner,
                repo,
                title: prTitle,
                head: sourceBranch,
                base: targetBranch,
                body,
                draft: false,
                maintainer_can_modify: true,
              });
              core.info(`Created release PR #${createdPr.data.number} (${prTitle}).`);
            }

      # Deploy Server & Client
      - name: Build Project
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_BRANDFETCH_CLIENT_ID: ${{ secrets.VITE_BRANDFETCH_CLIENT_ID }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VITE_PADDLE_CLIENT_TOKEN: ${{ secrets.VITE_PADDLE_CLIENT_TOKEN }}
          VITE_PADDLE_ENV: ${{ vars.VITE_PADDLE_ENV }}
        run: bun run build

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config dev.wrangler.jsonc --minify
