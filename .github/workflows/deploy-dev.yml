name: Deploy Dev

on:
  push:
    branches:
      - dev

concurrency:
  group: deploy-dev
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-preview:
    name: Semantic Release & Deploy
    runs-on: ubuntu-latest
    environment: "development"
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@v3

      - name: Install Dependencies
        run: bun install

      # Ahead of semantic-release on purpose: a failing gate must not leave a
      # published tag and a GitHub release behind for a commit that never ships.
      # The pre-push hook covers lint/type-check/circular locally, but it is
      # bypassable and never runs `test`. Turbo caches these, so a clean run is
      # seconds.
      - name: Quality Gate
        run: |
          bun run lint
          bun run type-check
          bun run test
          bun run check:boundaries

      - name: Run Semantic Release
        id: semantic_release
        uses: cycjimmy/semantic-release-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          HUSKY: 0

      - name: Sync Release PR (dev -> main)
        if: steps.semantic_release.outputs.new_release_published == 'true'
        uses: ./.github/actions/sync-release-pr
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          source-branch: dev
          target-branch: main
          release-version: ${{ steps.semantic_release.outputs.new_release_version }}
          release-notes: ${{ steps.semantic_release.outputs.new_release_notes }}

      # ---------------------------------------------------------------------------
      # Build — server only. The web client was retired in v4; the mobile app
      # ships through EAS, not this pipeline.
      # ---------------------------------------------------------------------------
      - name: Build Project
        run: bun run build

      # ---------------------------------------------------------------------------
      # Validate — assert every CF binding is present before touching Cloudflare.
      # vars.*    = non-sensitive config (GitHub plaintext variables)
      # secrets.* = sensitive credentials (GitHub encrypted secrets)
      # ---------------------------------------------------------------------------
      - name: Validate CF Bindings
        env:
          # Non-sensitive config (GitHub vars)
          BASE_URL: ${{ vars.BASE_URL }}
          CLIENT_ORIGIN: ${{ vars.CLIENT_ORIGIN }}
          CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
          POSTHOG_KEY: ${{ vars.POSTHOG_KEY }}
          # Sensitive credentials (GitHub secrets)
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bun run --cwd apps/server check-env

      - name: Set CF Worker Secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Non-sensitive config (GitHub vars)
          CF_BASE_URL: ${{ vars.BASE_URL }}
          CF_CLIENT_ORIGIN: ${{ vars.CLIENT_ORIGIN }}
          CF_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
          CF_POSTHOG_KEY: ${{ vars.POSTHOG_KEY }}
          # Sensitive credentials (GitHub secrets)
          CF_CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CF_CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}
          CF_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          jq -n '{
            BASE_URL: env.CF_BASE_URL,
            CLIENT_ORIGIN: env.CF_CLIENT_ORIGIN,
            CLERK_PUBLISHABLE_KEY: env.CF_CLERK_PUBLISHABLE_KEY,
            POSTHOG_KEY: env.CF_POSTHOG_KEY,
            CLERK_SECRET_KEY: env.CF_CLERK_SECRET_KEY,
            CLERK_WEBHOOK_SECRET: env.CF_CLERK_WEBHOOK_SECRET,
            DATABASE_URL: env.CF_DATABASE_URL
          }' | bunx wrangler secret bulk --config apps/server/dev.wrangler.jsonc

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run wrangler deploy --config apps/server/dev.wrangler.jsonc --minify
