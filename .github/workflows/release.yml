name: Release

on:
  push:
    branches:
      - main
      - dev

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Important: Fetch all history for accurate versioning
          persist-credentials: false # Using a PAT for the git plugin

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Run Semantic Release
        env:
          # Use a Personal Access Token (PAT) if you want to trigger the "Back-merge" workflow
          # Otherwise GITHUB_TOKEN is fine, but back-merge won't auto-trigger.
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bunx semantic-release
