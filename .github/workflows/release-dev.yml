name: Release Dev

on:
  push:
    branches:
      - dev

concurrency:
  group: release-dev
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-preview:
    name: Semantic Release
    runs-on: ubuntu-latest
    environment: "development"
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@v3

      - name: Install Dependencies
        run: bun install

      # Ahead of semantic-release on purpose: a failing gate must not leave a
      # published tag and a GitHub release behind for a commit that never ships.
      # The pre-push hook covers lint/type-check/circular locally, but it is
      # bypassable and never runs `test`. Turbo caches these, so a clean run is
      # seconds.
      - name: Quality Gate
        run: |
          bun run lint
          bun run type-check
          bun run test
          bun run check:boundaries

      - name: Run Semantic Release
        id: semantic_release
        uses: cycjimmy/semantic-release-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          HUSKY: 0

      - name: Sync Release PR (dev -> main)
        if: steps.semantic_release.outputs.new_release_published == 'true'
        uses: ./.github/actions/sync-release-pr
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          source-branch: dev
          target-branch: main
          release-version: ${{ steps.semantic_release.outputs.new_release_version }}
          release-notes: ${{ steps.semantic_release.outputs.new_release_notes }}
