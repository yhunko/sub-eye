name: Sync Release PR (Manual)

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: Source branch to release from
        required: true
        default: dev
        type: string
      target_branch:
        description: Target production branch
        required: true
        default: main
        type: string
      release_version:
        description: Optional release version override (e.g. 3.2.0-beta.20)
        required: false
        default: ""
        type: string
      include_latest_beta_notes:
        description: Include latest beta GitHub release notes in PR body
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: manual-release-pr-sync
  cancel-in-progress: true

jobs:
  sync-release-pr:
    name: Sync Release PR
    runs-on: ubuntu-latest

    steps:
      - name: Sync Release PR Body and Title
        uses: actions/github-script@v7
        env:
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          RELEASE_VERSION_INPUT: ${{ inputs.release_version }}
          INCLUDE_LATEST_BETA_NOTES: ${{ inputs.include_latest_beta_notes }}
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sourceBranch = process.env.SOURCE_BRANCH || "dev";
            const targetBranch = process.env.TARGET_BRANCH || "main";
            const compareRef = `${targetBranch}...${sourceBranch}`;
            const includeLatestBetaNotes = String(process.env.INCLUDE_LATEST_BETA_NOTES).toLowerCase() === "true";

            let releaseVersion = (process.env.RELEASE_VERSION_INPUT ?? "").trim();
            if (!releaseVersion) {
              const packageJsonResponse = await github.rest.repos.getContent({
                owner,
                repo,
                path: "package.json",
                ref: sourceBranch,
              });

              if (Array.isArray(packageJsonResponse.data)) {
                core.setFailed("Unexpected package.json response while reading source branch metadata.");
                return;
              }

              const packageJsonContent = Buffer.from(
                packageJsonResponse.data.content,
                packageJsonResponse.data.encoding,
              ).toString("utf8");
              const packageJson = JSON.parse(packageJsonContent);
              releaseVersion = String(packageJson.version ?? "").trim();
            }

            const stableVersion = releaseVersion.split("-")[0];
            const prTitle = `release/v${stableVersion}`;

            if (!releaseVersion || !/^\d+\.\d+\.\d+/.test(stableVersion)) {
              core.setFailed(`Invalid release version: ${releaseVersion}`);
              return;
            }

            let latestBetaNotes = "";
            if (includeLatestBetaNotes) {
              const releases = await github.paginate(github.rest.repos.listReleases, {
                owner,
                repo,
                per_page: 100,
              });

              const latestBeta = releases.find(
                (release) =>
                  release.prerelease &&
                  typeof release.tag_name === "string" &&
                  release.tag_name.startsWith(`v${stableVersion}-beta.`),
              );

              latestBetaNotes = (latestBeta?.body ?? "").trim();
            }

            const compareResponse = await github.rest.repos.compareCommitsWithBasehead({
              owner,
              repo,
              basehead: compareRef,
            });

            const rawCommits = compareResponse.data.commits ?? [];
            const MAX_COMMITS_IN_BODY = 120;

            const commits = rawCommits
              .map((commit) => {
                const subject = (commit.commit.message ?? "").split("\n")[0].trim();
                return {
                  sha: commit.sha,
                  subject,
                };
              })
              .filter((commit) => commit.subject.length > 0)
              .filter((commit) => !/^Merge\b/i.test(commit.subject))
              .filter((commit) => !/^chore\(release\):/i.test(commit.subject))
              .filter((commit) => !/^chore:\s*sync release from main to dev/i.test(commit.subject));

            const totalCommitCount = commits.length;
            const summarizedCommits =
              commits.length > MAX_COMMITS_IN_BODY
                ? commits.slice(commits.length - MAX_COMMITS_IN_BODY)
                : commits;

            const labelsByType = {
              feat: "Features (✨)",
              fix: "Fixes (🐛)",
              perf: "Performance (⚡)",
              refactor: "Refactors (♻️)",
              docs: "Documentation (📝)",
              test: "Tests (✅)",
              chore: "Chores (🧰)",
              other: "Other Changes (📦)",
            };

            const sectionOrder = [
              "feat",
              "fix",
              "perf",
              "refactor",
              "docs",
              "test",
              "chore",
              "other",
            ];

            const grouped = {
              feat: [],
              fix: [],
              perf: [],
              refactor: [],
              docs: [],
              test: [],
              chore: [],
              other: [],
            };

            for (const commit of summarizedCommits) {
              const match = /^([a-z]+)(\([^)]+\))?(!)?:\s+(.+)$/i.exec(commit.subject);

              if (!match) {
                grouped.other.push({
                  sha: commit.sha,
                  summary: commit.subject,
                });
                continue;
              }

              const [, rawType, , breakingFlag, rawSummary] = match;
              const type = sectionOrder.includes(rawType.toLowerCase()) ? rawType.toLowerCase() : "other";
              const summary = breakingFlag ? `${rawSummary} (breaking)` : rawSummary;

              grouped[type].push({
                sha: commit.sha,
                summary,
              });
            }

            const compareUrl = `https://github.com/${owner}/${repo}/compare/${compareRef}`;
            const bodyLines = [
              "## Release Summary",
              "",
              `- Target production version: \`v${stableVersion}\``,
              `- Source prerelease version: \`v${releaseVersion}\``,
              `- Branch flow: \`${sourceBranch}\` -> \`${targetBranch}\``,
              `- Compare changes: [${compareRef}](${compareUrl})`,
              `- Included commits in summary: \`${summarizedCommits.length}\` of \`${totalCommitCount}\``,
              "",
            ];

            if (latestBetaNotes.length > 0) {
              bodyLines.push("## Latest Beta Release Notes");
              bodyLines.push("");
              bodyLines.push(latestBetaNotes);
              bodyLines.push("");
            }

            bodyLines.push("## Changelist");
            bodyLines.push("");

            if (totalCommitCount > summarizedCommits.length) {
              bodyLines.push(
                `> Showing latest ${summarizedCommits.length} commits for readability. Use compare link for full delta.`,
              );
              bodyLines.push("");
            }

            let hasEntries = false;
            for (const type of sectionOrder) {
              const entries = grouped[type];
              if (entries.length === 0) {
                continue;
              }

              hasEntries = true;
              bodyLines.push(`### ${labelsByType[type]}`);
              bodyLines.push("");

              for (const entry of entries) {
                const shortSha = entry.sha.slice(0, 7);
                const commitUrl = `https://github.com/${owner}/${repo}/commit/${entry.sha}`;
                bodyLines.push(`- ${entry.summary} ([${shortSha}](${commitUrl}))`);
              }

              bodyLines.push("");
            }

            if (!hasEntries) {
              bodyLines.push("No conventional commit changes found in pending delta.");
              bodyLines.push("");
            }

            bodyLines.push("_This PR body is auto-generated from main...dev comparison._");
            const body = bodyLines.join("\n");

            const existingPrs = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              base: targetBranch,
              head: `${owner}:${sourceBranch}`,
              per_page: 1,
            });

            if (existingPrs.data.length > 0) {
              const existingPr = existingPrs.data[0];
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: existingPr.number,
                title: prTitle,
                body,
                base: targetBranch,
              });
              core.info(`Updated release PR #${existingPr.number} (${prTitle}).`);
            } else {
              const createdPr = await github.rest.pulls.create({
                owner,
                repo,
                title: prTitle,
                head: sourceBranch,
                base: targetBranch,
                body,
                draft: false,
                maintainer_can_modify: true,
              });
              core.info(`Created release PR #${createdPr.data.number} (${prTitle}).`);
            }
