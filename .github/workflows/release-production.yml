name: Release Production (Main)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches:
      - main

concurrency:
  group: release-production
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-production:
    name: Semantic Release
    runs-on: ubuntu-latest
    environment: "production"
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch Tags
        run: git fetch --force --tags

      - name: Setup Mise
        uses: jdx/mise-action@v3

      - name: Install Dependencies
        run: bun install

      # Ahead of semantic-release on purpose: a failing gate must not leave a
      # published tag and a GitHub release behind for a commit that never ships.
      # The pre-push hook covers lint/type-check/circular locally, but it is
      # bypassable and never runs `test`.
      - name: Quality Gate
        run: |
          bun run lint
          bun run type-check
          bun run test
          bun run check:boundaries

      - name: Run Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: HUSKY=0 bunx semantic-release

  back-merge:
    name: Sync Main back to Dev
    needs: release-production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Set Git Config
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Merge Main into Dev
        run: |
          git fetch origin main dev

          git checkout dev
          git pull origin dev

          git merge origin/main --no-edit -m "chore: sync release from main to dev [skip ci]"

          git push origin dev
