name: Release Production (Main)

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_CLIENT_PROJECT_ID: ${{ secrets.VERCEL_CLIENT_PROJECT_ID }}
  VERCEL_SERVER_PROJECT_ID: ${{ secrets.VERCEL_SERVER_PROJECT_ID }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches:
      - main

concurrency:
  group: release-production
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-production:
    name: Semantic Release & Deploy
    runs-on: ubuntu-latest
    environment: "production"
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch Tags
        run: git fetch --force --tags

      - name: Setup Mise
        uses: jdx/mise-action@v3

      - name: Check Agent Guidelines Mirrors
        run: bun run guidelines:check

      - name: Install Dependencies
        run: bun install

      - name: Apply Production DB Migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Missing database URL. Configure DATABASE_URL in GitHub secrets."
            exit 1
          fi

          bun run --cwd server db:migrate

      - name: Run Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: HUSKY=0 bunx semantic-release

      # ---------------------------------------------------------------------------
      # Build — vars.* are plaintext GitHub variables (non-sensitive).
      # VITE_PADDLE_ENV maps PADDLE_ENV (server canonical: sandbox/live) to the
      # Paddle JS SDK format (sandbox/production).
      # ---------------------------------------------------------------------------
      - name: Build Project
        env:
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
          VITE_BRANDFETCH_CLIENT_ID: ${{ vars.BRANDFETCH_CLIENT_ID }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VITE_PADDLE_CLIENT_TOKEN: ${{ vars.PADDLE_CLIENT_TOKEN }}
          VITE_PADDLE_ENV: ${{ vars.PADDLE_CLIENT_ENV }}          # Paddle.js SDK: sandbox | production
          VITE_POSTHOG_KEY: ${{ vars.POSTHOG_KEY }}
        run: bun run build

      # ---------------------------------------------------------------------------
      # Validate — assert every CF binding is present before touching Cloudflare.
      # vars.*    = non-sensitive config (GitHub plaintext variables)
      # secrets.* = sensitive credentials (GitHub encrypted secrets)
      # ---------------------------------------------------------------------------
      - name: Validate CF Bindings
        env:
          # Non-sensitive config (GitHub vars)
          BASE_URL: ${{ vars.BASE_URL }}
          CLIENT_ORIGIN: ${{ vars.CLIENT_ORIGIN }}
          CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
          PADDLE_ENV: ${{ vars.PADDLE_ENV }}
          PADDLE_PLUS_PRODUCT_ID: ${{ vars.PADDLE_PLUS_PRODUCT_ID }}
          POSTHOG_KEY: ${{ vars.POSTHOG_KEY }}
          TELEGRAM_BOT_USERNAME: ${{ vars.TELEGRAM_BOT_USERNAME }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
          # Sensitive credentials (GitHub secrets)
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PLANS_API_KEY: ${{ secrets.PLANS_API_KEY }}
          PADDLE_API_KEY: ${{ secrets.PADDLE_API_KEY }}
          PADDLE_WEBHOOK_SECRET: ${{ secrets.PADDLE_WEBHOOK_SECRET }}
          QSTASH_CURRENT_SIGNING_KEY: ${{ secrets.QSTASH_CURRENT_SIGNING_KEY }}
          QSTASH_NEXT_SIGNING_KEY: ${{ secrets.QSTASH_NEXT_SIGNING_KEY }}
          QSTASH_TOKEN: ${{ secrets.QSTASH_TOKEN }}
          QSTASH_URL: ${{ secrets.QSTASH_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET_TOKEN: ${{ secrets.TELEGRAM_WEBHOOK_SECRET_TOKEN }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: bun run --cwd server check-env

      - name: Set CF Worker Secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Non-sensitive config (GitHub vars)
          CF_BASE_URL: ${{ vars.BASE_URL }}
          CF_CLIENT_ORIGIN: ${{ vars.CLIENT_ORIGIN }}
          CF_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
          CF_PADDLE_ENV: ${{ vars.PADDLE_ENV }}
          CF_PADDLE_PLUS_PRODUCT_ID: ${{ vars.PADDLE_PLUS_PRODUCT_ID }}
          CF_POSTHOG_KEY: ${{ vars.POSTHOG_KEY }}
          CF_TELEGRAM_BOT_USERNAME: ${{ vars.TELEGRAM_BOT_USERNAME }}
          CF_VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          CF_VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
          # Sensitive credentials (GitHub secrets)
          CF_CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CF_CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}
          CF_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CF_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_PLANS_API_KEY: ${{ secrets.PLANS_API_KEY }}
          CF_PADDLE_API_KEY: ${{ secrets.PADDLE_API_KEY }}
          CF_PADDLE_WEBHOOK_SECRET: ${{ secrets.PADDLE_WEBHOOK_SECRET }}
          CF_QSTASH_CURRENT_SIGNING_KEY: ${{ secrets.QSTASH_CURRENT_SIGNING_KEY }}
          CF_QSTASH_NEXT_SIGNING_KEY: ${{ secrets.QSTASH_NEXT_SIGNING_KEY }}
          CF_QSTASH_TOKEN: ${{ secrets.QSTASH_TOKEN }}
          CF_QSTASH_URL: ${{ secrets.QSTASH_URL }}
          CF_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CF_TELEGRAM_WEBHOOK_SECRET_TOKEN: ${{ secrets.TELEGRAM_WEBHOOK_SECRET_TOKEN }}
          CF_VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          jq -n '{
            BASE_URL: env.CF_BASE_URL,
            CLIENT_ORIGIN: env.CF_CLIENT_ORIGIN,
            CLERK_PUBLISHABLE_KEY: env.CF_CLERK_PUBLISHABLE_KEY,
            PADDLE_ENV: env.CF_PADDLE_ENV,
            PADDLE_PLUS_PRODUCT_ID: env.CF_PADDLE_PLUS_PRODUCT_ID,
            POSTHOG_KEY: env.CF_POSTHOG_KEY,
            TELEGRAM_BOT_USERNAME: env.CF_TELEGRAM_BOT_USERNAME,
            VAPID_PUBLIC_KEY: env.CF_VAPID_PUBLIC_KEY,
            VAPID_SUBJECT: env.CF_VAPID_SUBJECT,
            CLERK_SECRET_KEY: env.CF_CLERK_SECRET_KEY,
            CLERK_WEBHOOK_SECRET: env.CF_CLERK_WEBHOOK_SECRET,
            DATABASE_URL: env.CF_DATABASE_URL,
            GEMINI_API_KEY: env.CF_GEMINI_API_KEY,
            PLANS_API_KEY: env.CF_PLANS_API_KEY,
            PADDLE_API_KEY: env.CF_PADDLE_API_KEY,
            PADDLE_WEBHOOK_SECRET: env.CF_PADDLE_WEBHOOK_SECRET,
            QSTASH_CURRENT_SIGNING_KEY: env.CF_QSTASH_CURRENT_SIGNING_KEY,
            QSTASH_NEXT_SIGNING_KEY: env.CF_QSTASH_NEXT_SIGNING_KEY,
            QSTASH_TOKEN: env.CF_QSTASH_TOKEN,
            QSTASH_URL: env.CF_QSTASH_URL,
            TELEGRAM_BOT_TOKEN: env.CF_TELEGRAM_BOT_TOKEN,
            TELEGRAM_WEBHOOK_SECRET_TOKEN: env.CF_TELEGRAM_WEBHOOK_SECRET_TOKEN,
            VAPID_PRIVATE_KEY: env.CF_VAPID_PRIVATE_KEY
          }' | bunx wrangler secret bulk --config prod.wrangler.jsonc

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run wrangler deploy --config prod.wrangler.jsonc --minify

  back-merge:
    name: Sync Main back to Dev
    needs: release-production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Set Git Config
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Merge Main into Dev
        run: |
          git fetch origin main dev

          git checkout dev
          git pull origin dev

          git merge origin/main --no-edit -m "chore: sync release from main to dev [skip ci]"

          git push origin dev
