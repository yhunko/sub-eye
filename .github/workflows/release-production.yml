name: Release Production (Main)

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_CLIENT_PROJECT_ID: ${{ secrets.VERCEL_CLIENT_PROJECT_ID }}
  VERCEL_SERVER_PROJECT_ID: ${{ secrets.VERCEL_SERVER_PROJECT_ID }}

on:
  push:
    branches:
      - main

concurrency:
  group: release-production
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-production:
    name: Semantic Release & Deploy
    runs-on: ubuntu-latest
    environment: "production"
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch Tags
        run: git fetch --force --tags

      - name: Setup Mise
        uses: jdx/mise-action@v3

      - name: Check Agent Guidelines Mirrors
        run: bun run guidelines:check

      - name: Install Dependencies
        run: bun install

      - name: Apply Production DB Migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Missing database URL. Configure DATABASE_URL in GitHub secrets."
            exit 1
          fi

          bun run --cwd server db:migrate

      - name: Run Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: HUSKY=0 bunx semantic-release

      # Deploy Server & Client
      - name: Build Project
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_BRANDFETCH_CLIENT_ID: ${{ secrets.VITE_BRANDFETCH_CLIENT_ID }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VITE_PADDLE_CLIENT_TOKEN: ${{ secrets.VITE_PADDLE_CLIENT_TOKEN }}
          VITE_PADDLE_ENV: ${{ vars.VITE_PADDLE_ENV }}
        run: bun run build

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config prod.wrangler.jsonc --minify --var PADDLE_PLUS_PRODUCT_ID:${{ vars.PADDLE_PLUS_PRODUCT_ID }}

  back-merge:
    name: Sync Main back to Dev
    needs: release-production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Set Git Config
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Merge Main into Dev
        run: |
          git fetch origin main dev

          git checkout dev
          git pull origin dev

          git merge origin/main --no-edit -m "chore: sync release from main to dev [skip ci]"

          git push origin dev
