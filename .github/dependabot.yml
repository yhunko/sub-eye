version: 2
updates:
  # Security updates only: a limit of 0 turns version-update PRs off. Without
  # this entry Dependabot looks for a lockfile beside each package.json and
  # fails, because the only bun.lock is at the root.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
